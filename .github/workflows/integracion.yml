name: BookStore API y UI
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: bookstore-integracion
  cancel-in-progress: false
jobs:
  probar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: bookstore-ci-${{ github.run_id }}
      PARALELO: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Descargar imágenes privadas
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/miguelangelruizfuentes/lognext-bookstore-backend:1.0.0
          docker pull ghcr.io/miguelangelruizfuentes/lognext-bookstore-frontend:1.0.0
          docker tag ghcr.io/miguelangelruizfuentes/lognext-bookstore-backend:1.0.0 bookstore-qa-sandbox-backend:1.0.0
          docker tag ghcr.io/miguelangelruizfuentes/lognext-bookstore-frontend:1.0.0 bookstore-qa-sandbox-frontend:1.0.0
      - name: Levantar el entorno
        run: |
          docker compose -f compose.yml up -d --wait --wait-timeout 120
          npm run entorno:esperar
      - name: Ejecutar la suite completa en paralelo
        run: npm test
      - name: Guardar estado del entorno
        if: always()
        run: |
          mkdir -p reports
          docker compose -f compose.yml ps -a > reports/estado-entorno.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-bookstore-${{ github.run_number }}
          path: |
            reports/
            evidencia/
          retention-days: 7
      - name: Retirar los contenedores
        if: always()
        run: |
          docker compose -f compose.yml down -v
