name: Validación del framework
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:dry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validacion-gherkin
          path: reports/
          retention-days: 7
